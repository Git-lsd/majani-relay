<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#154727">
<meta name="description" content="Offline coffee leaf check for cooperative relay farmers. The extension officer makes the final call.">
<title>Majani Relay</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Majani Relay">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Icon sprite: simple 24x24 stroke icons, used via <use href="#i-name"> -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19C5 10 10 5 20 4c-1 10-6 15-15 15z"/><path d="M5 19l9-9"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="4"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></symbol>
  <symbol id="i-question" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 114 2c-1 .7-1.5 1.2-1.5 2.5M12 17v.5"/></symbol>
  <symbol id="i-officer" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20V11M11 20V5M17 20v-6M2 20h20"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M4 20h16"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V5M7 10l5-5 5 5M4 20h16"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4h12l-2 4 2 4H5"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M10 6h11M10 12h11M10 18h11M3 6l1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
</svg>

<header class="top">
  <div class="top-row">
    <div class="brand"><img src="icons/icon-192.png" alt="" width="30" height="30"><span>Majani Relay</span></div>
    <div class="chips">
      <span id="net-status" class="chip"></span>
      <span id="model-status" class="chip chip-wait">Loading model</span>
    </div>
  </div>
  <div class="lang" role="group" aria-label="Language for answers">
    <button type="button" data-lang="sw">Kiswahili</button>
    <button type="button" data-lang="en">English</button>
    <button type="button" data-lang="kik">Gĩkũyũ</button>
  </div>
</header>

<main id="main">
  <section id="tab-visit" class="tab" aria-label="Plot visit"></section>
  <section id="tab-review" class="tab" aria-label="Officer review" hidden></section>
  <section id="tab-coop" class="tab" aria-label="Co-op dashboard" hidden></section>
  <section id="tab-about" class="tab" aria-label="About and privacy" hidden></section>
  <noscript><p class="card">This app needs JavaScript turned on.</p></noscript>
</main>

<nav class="tabbar" aria-label="Screens">
  <button type="button" data-tab="visit"><svg class="ic" aria-hidden="true"><use href="#i-leaf"/></svg><span>Plot visit</span></button>
  <button type="button" data-tab="review"><svg class="ic" aria-hidden="true"><use href="#i-officer"/></svg><span>Officer</span><b id="queue-badge" class="badge" hidden></b></button>
  <button type="button" data-tab="coop"><svg class="ic" aria-hidden="true"><use href="#i-chart"/></svg><span>Co-op</span></button>
  <button type="button" data-tab="about"><svg class="ic" aria-hidden="true"><use href="#i-info"/></svg><span>About</span></button>
</nav>

<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<!-- onnxruntime-web 1.30.0 (MIT), wasm-only build, vendored: no CDN requests at run time -->
<script src="vendor/ort/ort.wasm.min.js" defer></script>
<!-- shared maths (familiarity check, beta-binomial prior), same as ml/train_eval.py -->
<script src="lib/kahawa-core.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
